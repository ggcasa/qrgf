<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generator QR VIN</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link rel="manifest" href="manifest.json">
  <style>
    :root {
        --color-scheme: dark light;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #f8fafc;
      box-sizing: border-box;
    }

    h3 {
      margin: 8px 0 14px;
      color: #0f172a;
      font-size: 1.1rem;
    }

    /* Câmpul suplimentar dedicat pentru Paste */
    .paste-box {
      width: 100%;
      max-width: 360px;
      padding: 10px 12px;
      font-size: 15px;
      border: 2px dashed #94a3b8;
      border-radius: 8px;
      background: #ffffff;
      text-transform: uppercase;
      box-sizing: border-box;
      margin-bottom: 14px;
      text-align: center;
      outline: none;
    }

    .paste-box:focus {
      border-color: #2563eb;
      background: #eff6ff;
    }

    /* Grila celor 17 căsuțe */
    .vin-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 5px;
      max-width: 360px;
      margin-bottom: 16px;
    }

    .vin-box {
      width: 34px;
      height: 42px;
      font-size: 18px;
      font-weight: 700;
      text-align: center;
      text-transform: uppercase;
      border: 1.5px solid #cbd5e1;
      border-radius: 6px;
      background: #ffffff;
      outline: none;
      box-sizing: border-box;
      caret-color: #2563eb;
    }

    .vin-box:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
    }

    /* Butoane de acțiune */
    .btn-group {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 360px;
      margin-bottom: 16px;
    }

    button {
      flex: 1;
      padding: 12px 0;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn-generate {
      background-color: #2563eb;
      color: #ffffff;
    }

    .btn-generate:active {
      background-color: #1d4ed8;
    }

    .btn-reset {
      background-color: #e2e8f0;
      color: #334155;
    }

    .btn-reset:active {
      background-color: #cbd5e1;
    }

    #errorMsg {
      color: #dc2626;
      font-size: 13px;
      margin-bottom: 12px;
      min-height: 18px;
      text-align: center;
    }

    #qrcode {
      display: flex;
      justify-content: center;
      background: #ffffff;
      padding: 12px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
  </style>
</head>
<body>
  <!-- Input adițional pentru Paste rapid -->
  <input 
    type="text" 
    id="pasteInput" 
    class="paste-box" 
    placeholder="📋 Dă Paste aici la seria completă" 
    autocomplete="off"
  />

  <!-- Cele 17 căsuțe -->
  <div class="vin-grid" id="vinContainer"></div>

  <div class="btn-group">
    <button type="button" class="btn-generate" onclick="generateQr()">Generează QR</button>
    <button type="button" class="btn-reset" onclick="resetForm()">Reset</button>
  </div>

  <div id="errorMsg"></div>
  <div id="qrcode"></div>

  <script>
    const container = document.getElementById('vinContainer');
    const pasteInput = document.getElementById('pasteInput');
    const errorMsg = document.getElementById('errorMsg');
    const qrDiv = document.getElementById('qrcode');
    let qrInstance = null;

    // Generăm cele 17 căsuțe
    for (let i = 0; i < 17; i++) {
      const input = document.createElement('input');
      input.type = 'text';
      input.maxLength = 1;
      input.className = 'vin-box';
      input.autocomplete = 'off';
      input.autocapitalize = 'characters';
      container.appendChild(input);
    }

    const boxes = document.querySelectorAll('.vin-box');

    // 1. Logica pentru câmpul adițional de Paste
    pasteInput.addEventListener('input', (e) => {
      const rawText = e.target.value.toUpperCase();
      // Curățăm textul: doar caractere conforme VIN (fără I, O, Q)
      const clean = rawText.replace(/[^A-HJ-NPR-Z0-9]/g, '');

      if (clean.length > 0) {
        for (let i = 0; i < 17; i++) {
          boxes[i].value = clean[i] || '';
        }
        // Golește câmpul de paste după ce distribuie caracterele
        e.target.value = '';
        errorMsg.textContent = '';
      }
    });

    // 2. Logica pentru tastare manuală în cele 17 căsuțe
    boxes.forEach((box, idx) => {
      box.addEventListener('input', (e) => {
        let val = e.target.value.toUpperCase();

        if (/[^A-HJ-NPR-Z0-9]/.test(val)) {
          e.target.value = '';
          return;
        }

        e.target.value = val;

        // Salt la următoarea căsuță
        if (val && idx < boxes.length - 1) {
          boxes[idx + 1].focus();
        }
      });

      // Salt înapoi la Backspace
      box.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !box.value && idx > 0) {
          boxes[idx - 1].focus();
        }
      });
    });

    // 3. Generare cod QR
    function generateQr() {
      const vin = Array.from(boxes).map(b => b.value).join('');
      errorMsg.textContent = '';
      qrDiv.innerHTML = '';

      if (vin.length !== 17) {
        errorMsg.textContent = `Ai completat doar ${vin.length} din 17 caractere.`;
        return;
      }

      qrInstance = new QRCode(qrDiv, {
        text: vin,
        width: 180,
        height: 180,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
      });
    }

    // 4. Reset complet
    function resetForm() {
      boxes.forEach(b => b.value = '');
      pasteInput.value = '';
      qrDiv.innerHTML = '';
      errorMsg.textContent = '';
      boxes[0].focus();
    }
  </script>
<script>
// Înregistrare Service Worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then((registration) => {
        console.log('Service Worker înregistrat cu succes:', registration.scope);
      })
      .catch((error) => {
        console.error('Înregistrare Service Worker eșuată:', error);
      });
  });
}</script>
</body>
</html>
